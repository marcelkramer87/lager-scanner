<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SECU LAGER Scanner</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    :root {
      --bg: #121212;
      --card: #1e1e1e;
      --primary: #007aff;
      --success: #34c759;
      --text: #ffffff;
      --text-sub: #aaa;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    .header h2 { margin: 0 0 6px 0; font-size: 22px; }
    .header p { margin: 0; font-size: 14px; color: var(--text-sub); }
    #reader {
      width: 100%;
      max-width: 400px;
      border-radius: 16px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .btn-group {
      width: 100%;
      max-width: 400px;
      margin-top: 20px;
      display: flex;
      gap: 10px;
    }
    button {
      flex: 1;
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    #btnStart { background: var(--success); color: #fff; }
    #btnStop { background: #ff3b30; color: #fff; display: none; }
    .result-card {
      width: 100%;
      max-width: 400px;
      background: var(--card);
      border-radius: 12px;
      padding: 16px;
      margin-top: 20px;
      box-sizing: border-box;
    }
    .result-card label { font-size: 12px; color: var(--text-sub); text-transform: uppercase; }
    .result-card .value { font-size: 18px; font-weight: bold; color: var(--primary); margin-top: 4px; word-break: break-all; }
    .status-badge { font-size: 13px; margin-top: 10px; color: var(--text-sub); }
  </style>
</head>
<body>

  <div class="header">
    <h2>📦 SECU LAGER Scanner</h2>
    <p>Mobiles Erfassungsterminal</p>
  </div>

  <div id="reader"></div>

  <div class="btn-group">
    <button id="btnStart" onclick="startScanner()">📷 Kamera starten</button>
    <button id="btnStop" onclick="stopScanner()">⏹ Stoppen</button>
  </div>

  <div class="result-card">
    <label>Letzter gescannter Code</label>
    <div id="scanResult" class="value">Noch kein Code erfasst</div>
    <div id="statusText" class="status-badge">Bereit zum Scannen.</div>
  </div>

  <script>
    let html5QrCode = null;

    // HIER KOMMT SPÄTER DIE WEB-APP URL DEINES KUNDEN REIN:
    const WEB_APP_URL = ""; 

    function startScanner() {
      document.getElementById('btnStart').style.display = 'none';
      document.getElementById('statusText').textContent = 'Kamera wird initialisiert...';

      html5QrCode = new Html5Qrcode("reader");
      const config = { fps: 10, qrbox: { width: 250, height: 250 } };

      html5QrCode.start(
        { facingMode: "environment" }, 
        config, 
        (decodedText) => {
          onCodeScanned(decodedText);
        },
        () => {}
      ).then(() => {
        document.getElementById('btnStop').style.display = 'block';
        document.getElementById('statusText').textContent = 'Kamera aktiv. QR-Code vor die Linse halten.';
      }).catch(err => {
        alert("Kamera-Fehler: " + err);
        document.getElementById('btnStart').style.display = 'block';
        document.getElementById('btnStop').style.display = 'none';
        document.getElementById('statusText').textContent = 'Fehler beim Kamera-Start.';
      });
    }

    function stopScanner() {
      if (html5QrCode) {
        html5QrCode.stop().then(() => {
          html5QrCode.clear();
          document.getElementById('btnStart').style.display = 'block';
          document.getElementById('btnStop').style.display = 'none';
          document.getElementById('statusText').textContent = 'Scanner gestoppt.';
        });
      }
    }

    function onCodeScanned(code) {
      document.getElementById('scanResult').textContent = code;
      
      if (WEB_APP_URL) {
        document.getElementById('statusText').textContent = 'Sende Daten an Tabelle...';
        fetch(WEB_APP_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ qrCode: code })
        }).then(() => {
          document.getElementById('statusText').textContent = 'Erfolgreich verbucht!';
        }).catch(err => {
          document.getElementById('statusText').textContent = 'Fehler: ' + err;
        });
      } else {
        document.getElementById('statusText').textContent = 'Code erfasst!';
      }
    }
  </script>
</body>
</html>
